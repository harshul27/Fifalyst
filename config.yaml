# ============================================
# Premier League 2026/27 - Season Stats Recorder
# ============================================

competition:
  name: "Premier League"
  season: "2026-27"
  gameweeks: 38
  season_start: "2026-08-21"

# ============================================
# Data sources
# ============================================
sources:
  fpl:
    # Official Fantasy Premier League API. Public, no auth, no rate-limit issues.
    # Natively organised by gameweek, which is why it is the primary source.
    base_url: "https://fantasy.premierleague.com/api"
    timeout: 15
    endpoints:
      bootstrap: "bootstrap-static/"      # teams, players, positions, gameweeks
      live: "event/{gw}/live/"            # per-player stats for one gameweek

  fbref:
    # Optional tactical depth (possession, pass completion, progressive passes)
    # via the `soccerdata` package. Scrapes and rate-limits, so it is opt-in:
    #   python record.py --fbref
    enabled: false
    league: "ENG-Premier League"
    season: "2026-2027"
    stat_types: [possession, passing]

  physical:
    # Distance / sprints / high-speed running / top speed have no free public
    # feed. Columns exist but stay empty until a real provider is wired into
    # pipeline/physical_adapter.py. No estimates are ever substituted.
    enabled: false
    adapter: "pipeline.physical_adapter.PhysicalStatsAdapter"

# ============================================
# Storage
# ============================================
storage:
  format: parquet
  base_dir: "data/pl_2026_27"
  layout: "gw{n}/players.parquet + gw{n}/teams.parquet + meta.json"
  # A gameweek is re-recorded until FPL marks it finished AND data_checked,
  # which is when stats like the ICT family are finalised.
  refresh_until_final: true

# ============================================
# Team tactical buckets (dashboard grouping)
# ============================================
tactics:
  attacking: [goals_scored, assists, expected_goals, expected_goal_involvements, threat, finishing_edge]
  midfield: [expected_assists, creativity, influence, recoveries, ict_index]
  defensive: [goals_conceded, expected_goals_conceded, clean_sheet, tackles,
              clearances_blocks_interceptions, saves, defensive_actions]

# ============================================
# Logging
# ============================================
logging:
  level: "INFO"
  format: "%(levelname)s %(message)s"
